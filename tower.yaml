# 通用个人分流：只依赖业务组，不依赖机场、节点品牌或地区名称。
# 首次导入必须手选“海外默认”和“Crypto”的节点；初始REJECT是有意设置。
# 金融与AI/X默认跟随海外默认，也可分别固定到任意启用节点。
# 刻意不提供自动测速/自动切换组：所有出口手选并保持，出口IP稳定服务于账户风控。
# 节点只在塔台维护；日常例外编辑rules/中的小文件。
# 规则边界与优先级见docs/routing-design.md。
rules:
- RULE-SET,private,DIRECT
- RULE-SET,private-ip,DIRECT,no-resolve
- RULE-SET,personal-direct,DIRECT
- RULE-SET,hsbc-cn,DIRECT
- RULE-SET,personal-proxy,🌍 海外默认
- RULE-SET,personal-finance,🏦 金融
- RULE-SET,personal-crypto,🪙 Crypto
- RULE-SET,personal-ai-x,🤖 AI / X
- RULE-SET,ibkr,🏦 金融
- RULE-SET,schwab,🏦 金融
- RULE-SET,longbridge,🏦 金融
- RULE-SET,hsbc,🏦 金融
- RULE-SET,category-cryptocurrency,🪙 Crypto
- RULE-SET,category-ai-!cn,🤖 AI / X
- RULE-SET,twitter,🤖 AI / X
- RULE-SET,category-ads-all,🛑 广告过滤
- RULE-SET,cn,DIRECT
- RULE-SET,cn-ip,DIRECT
- MATCH,🌍 海外默认
proxy-groups:
- name: 🌍 海外默认
  type: select
  proxies:
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 金融
  type: select
  proxies:
  - 🌍 海外默认
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🪙 Crypto
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 🤖 AI / X
  type: select
  proxies:
  - 🌍 海外默认
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🛑 广告过滤
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
rule-providers:
  private:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.yaml
    path: ./rule-cache/private.yaml
    interval: 86400
    proxy: 🌍 海外默认
  private-ip:
