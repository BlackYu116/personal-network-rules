# Tower 个性化规则模板；不含任何节点或订阅凭据。
# 先在塔台启用机场和名称含 DMIT 的自有节点，再导入本文件。
# 常用域名和业务目标在 rules 中修改；默认出口在 proxy-groups 的第一项修改。
# 顶层文件修改后，在塔台重新导入此地址并重新导出。
# 远程规则集内容更新与顶层模板更新是两件事，详见 README。
# 塔台可能重建 DNS；Tello 的真实 IP/DNS 例外按 docs/tello.md 一次性核对。
rules:
- RULE-SET,private,DIRECT
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- RULE-SET,hsbc-cn,DIRECT
- DOMAIN-SUFFIX,hsbc.co.uk,🏦 HSBC UK
- DOMAIN-SUFFIX,hsbc.com.hk,🏦 HSBC HK
- RULE-SET,ibkr,📈 IBKR
- RULE-SET,schwab,📈 Schwab
- RULE-SET,longbridge,📈 Longbridge
- RULE-SET,hsbc,🏦 海外银行
- DOMAIN-SUFFIX,tradingview.com,🪙 Crypto
- DOMAIN-SUFFIX,tradingview-widget.com,🪙 Crypto
- DOMAIN-SUFFIX,tradingview.io,🪙 Crypto
- DOMAIN-SUFFIX,tvcdn.com,🪙 Crypto
- RULE-SET,binance,🪙 Crypto
- RULE-SET,okx,🪙 Crypto
- RULE-SET,category-cryptocurrency,🪙 Crypto
- DOMAIN-SUFFIX,anthropic.com,🤖 AI
- DOMAIN-SUFFIX,claude.ai,🤖 AI
- DOMAIN-SUFFIX,claude.com,🤖 AI
- DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI
- DOMAIN-SUFFIX,openai.com,🤖 AI
- DOMAIN-SUFFIX,chatgpt.com,🤖 AI
- DOMAIN-SUFFIX,oaistatic.com,🤖 AI
- DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI
- DOMAIN-SUFFIX,tello.com,☎️ Tello
- DOMAIN-SUFFIX,t-mobile.com,☎️ Tello
- DOMAIN-SUFFIX,mnc240.mcc310.pub.3gppnetwork.org,☎️ Tello
- DOMAIN-SUFFIX,mnc260.mcc310.pub.3gppnetwork.org,☎️ Tello
- AND,((NETWORK,UDP),(DST-PORT,500),(IP-CIDR,208.54.0.0/16,no-resolve)),☎️ Tello
- AND,((NETWORK,UDP),(DST-PORT,4500),(IP-CIDR,208.54.0.0/16,no-resolve)),☎️ Tello
- DOMAIN-SUFFIX,apple.news,📰 Apple News
- DOMAIN-SUFFIX,news.apple.com,📰 Apple News
- DOMAIN-SUFFIX,news-client-search.apple.com,📰 Apple News
- DOMAIN-SUFFIX,news-assets.apple.com,📰 Apple News
- DOMAIN-SUFFIX,news-events.apple.com,📰 Apple News
- DOMAIN-SUFFIX,news-edge.apple.com,📰 Apple News
- DOMAIN-SUFFIX,news-todayconfig-edge.apple.com,📰 Apple News
- DOMAIN-SUFFIX,news-sports-events.apple.com,📰 Apple News
- DOMAIN-SUFFIX,news-client.apple.com,📰 Apple News
- DOMAIN,gateway.icloud.com,📰 Apple News
- RULE-SET,category-ads-all,🛑 广告拦截
- RULE-SET,microsoft,Ⓜ️ Microsoft
- RULE-SET,apple,🍎 Apple 其他
- RULE-SET,cn,DIRECT
- RULE-SET,cn-ip,DIRECT
- MATCH,🌍 海外默认
