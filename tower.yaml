# 地区银行、券商及跨地区品牌共享出口；不按节点名猜地区、不自动换节点。
# 境外地区组初始REJECT；内地银行默认DIRECT；三品牌共享组默认跟随香港券商。
# 金融域名维护源data/financial-services.yaml；来源与边界docs/financial-coverage.md。
# 节点/凭据由塔台管理；Tailscale专用规则必须在通用private/private-ip前。
rules:
- RULE-SET,private,DIRECT
- RULE-SET,private-ip,DIRECT,no-resolve
- RULE-SET,personal-direct,DIRECT
- RULE-SET,bank-cn-priority,🏦 银行-内地
- RULE-SET,finance-priority,🏦 金融
- RULE-SET,bank-hk,🏦 银行-香港
- RULE-SET,bank-us,🏦 银行-美国
- RULE-SET,bank-sg,🏦 银行-新加坡
- RULE-SET,bank-cn,🏦 银行-内地
- RULE-SET,hsbc-cn,🏦 银行-内地
- RULE-SET,broker-hk,📈 券商-香港
- RULE-SET,broker-us,📈 券商-美国
- RULE-SET,broker-sg,📈 券商-新加坡
- RULE-SET,broker-futu,📈 富途/Moomoo
- RULE-SET,broker-webull,📈 Webull
- RULE-SET,broker-tiger,📈 Tiger
- RULE-SET,personal-finance,🏦 金融
- RULE-SET,personal-crypto,🪙 Crypto
- RULE-SET,personal-ai-x,🤖 AI / X
- RULE-SET,personal-proxy,🌍 海外默认
- RULE-SET,ibkr,🏦 金融
- RULE-SET,schwab,📈 券商-美国
- RULE-SET,longbridge,📈 券商-香港
- RULE-SET,hsbc,🏦 金融
- RULE-SET,category-cryptocurrency,🪙 Crypto
- RULE-SET,category-ai-!cn,🤖 AI / X
- RULE-SET,twitter,🤖 AI / X
- RULE-SET,category-ads-all,🛑 广告过滤
- RULE-SET,cn,DIRECT
- RULE-SET,cn-ip,DIRECT
- MATCH,🌍 海外默认
proxy-groups:
- name: 🌍 海外默认
  type: select
  proxies:
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 金融
  type: select
  proxies:
  - 🌍 海外默认
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 银行-内地
  type: select
  proxies:
  - DIRECT
  - REJECT
  include-all: true
  filter: .*
- name: 🏦 银行-香港
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 银行-美国
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 银行-新加坡
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 📈 券商-香港
  type: select
  proxies:
  - REJECT
  - 🏦 银行-香港
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 📈 券商-美国
  type: select
  proxies:
  - REJECT
  - 🏦 银行-美国
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 📈 券商-新加坡
  type: select
  proxies:
  - REJECT
  - 🏦 银行-新加坡
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 📈 富途/Moomoo
  type: select
  proxies:
  - 📈 券商-香港
  - 📈 券商-美国
  - 📈 券商-新加坡
  - 🏦 金融
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 📈 Webull
  type: select
  proxies:
  - 📈 券商-香港
  - 📈 券商-美国
  - 📈 券商-新加坡
  - 🏦 金融
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 📈 Tiger
  type: select
  proxies:
  - 📈 券商-香港
  - 📈 券商-美国
  - 📈 券商-新加坡
  - 🏦 金融
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🪙 Crypto
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 🤖 AI / X
  type: select
  proxies:
  - 🌍 海外默认
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🛑 广告过滤
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
