# 8 个手选组；节点只在塔台维护。
# 日常添加域名：编辑 rules/ 下的小文件。改变组/优先级后重新导入本模板。
# DNS 地址见文档；高级 DNS 覆写不由塔台无损透传。
rules:
- RULE-SET,private,DIRECT
- RULE-SET,private-ip,DIRECT,no-resolve
- RULE-SET,personal-direct,DIRECT
- RULE-SET,personal-finance,🏦 金融
- RULE-SET,personal-crypto,🪙 Crypto
- RULE-SET,personal-ai-x,🤖 AI / X
- RULE-SET,personal-apple-news,📰 Apple News
- AND,((NETWORK,UDP),(DST-PORT,500),(IP-CIDR,208.54.0.0/16,no-resolve)),DIRECT
- AND,((NETWORK,UDP),(DST-PORT,4500),(IP-CIDR,208.54.0.0/16,no-resolve)),DIRECT
- RULE-SET,hsbc-cn,DIRECT
- RULE-SET,ibkr,🏦 金融
- RULE-SET,schwab,🏦 金融
- RULE-SET,longbridge,🏦 金融
- RULE-SET,hsbc,🏦 金融
- RULE-SET,category-cryptocurrency,🪙 Crypto
- RULE-SET,category-ai-!cn,🤖 AI / X
- RULE-SET,twitter,🤖 AI / X
- RULE-SET,category-ads-all,REJECT
- RULE-SET,microsoft,DIRECT
- RULE-SET,cn,DIRECT
- RULE-SET,cn-ip,DIRECT
- MATCH,🌍 海外默认
proxy-groups:
- name: 🌍 海外默认
  type: select
  proxies:
  - 🇺🇸 DMIT 专线
  - 🇯🇵 日本节点
  - 🌐 全部节点
  - DIRECT
  - REJECT
- name: 🏦 金融
  type: select
  proxies:
  - 🇺🇸 DMIT 专线
  - 🇯🇵 日本节点
  - 🌐 全部节点
  - DIRECT
  - REJECT
- name: 🪙 Crypto
  type: select
  proxies:
  - 🇯🇵 日本节点
  - 🇺🇸 DMIT 专线
  - 🌐 全部节点
  - DIRECT
  - REJECT
- name: 🤖 AI / X
  type: select
  proxies:
  - 🇺🇸 DMIT 专线
  - 🇯🇵 日本节点
  - 🌐 全部节点
  - DIRECT
  - REJECT
- name: 📰 Apple News
  type: select
  proxies:
  - 🇺🇸 DMIT 专线
  - 🇯🇵 日本节点
  - 🌐 全部节点
  - DIRECT
  - REJECT
- name: 🇺🇸 DMIT 专线
  type: select
  include-all: true
  filter: (?i)(^|[^A-Za-z0-9])DMIT([^A-Za-z0-9]|$)
- name: 🇯🇵 日本节点
  type: select
  include-all: true
  filter: (?i)日本|🇯🇵|Japan|\bJP\b
- name: 🌐 全部节点
  type: select
  include-all: true
  filter: .*
rule-providers:
