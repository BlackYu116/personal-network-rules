# 通用个人分流：节点来源由塔台维护，所有业务出口保持手选。
# 海外默认、Crypto及香港/美国/新加坡银行组首次必须手选；未选为REJECT。
# 内地银行组默认DIRECT；金融保留给券商、其他地区和无法区分地区的共享银行端点。
# 不按节点名猜地区，不测速换出口；地区组的名字不证明所选节点真实地区。
# 银行证据与共享域名边界见docs/bank-regions.md；Tailscale由塔台私有配置管理。
rules:
- RULE-SET,private,DIRECT
- RULE-SET,private-ip,DIRECT,no-resolve
- RULE-SET,personal-direct,DIRECT
- RULE-SET,bank-cn,🏦 银行-内地
- RULE-SET,bank-hk,🏦 银行-香港
- RULE-SET,bank-us,🏦 银行-美国
- RULE-SET,bank-sg,🏦 银行-新加坡
- RULE-SET,hsbc-cn,🏦 银行-内地
- RULE-SET,personal-finance,🏦 金融
- RULE-SET,personal-crypto,🪙 Crypto
- RULE-SET,personal-ai-x,🤖 AI / X
- RULE-SET,personal-proxy,🌍 海外默认
- RULE-SET,ibkr,🏦 金融
- RULE-SET,schwab,🏦 金融
- RULE-SET,longbridge,🏦 金融
- RULE-SET,hsbc,🏦 金融
- RULE-SET,category-cryptocurrency,🪙 Crypto
- RULE-SET,category-ai-!cn,🤖 AI / X
- RULE-SET,twitter,🤖 AI / X
- RULE-SET,category-ads-all,🛑 广告过滤
- RULE-SET,cn,DIRECT
- RULE-SET,cn-ip,DIRECT
- MATCH,🌍 海外默认
proxy-groups:
- name: 🌍 海外默认
  type: select
  proxies:
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 金融
  type: select
  proxies:
  - 🌍 海外默认
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 银行-内地
  type: select
  proxies:
  - DIRECT
  - REJECT
  include-all: true
  filter: .*
- name: 🏦 银行-香港
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 银行-美国
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 🏦 银行-新加坡
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 🪙 Crypto
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
  include-all: true
  filter: .*
- name: 🤖 AI / X
  type: select
  proxies:
  - 🌍 海外默认
  - REJECT
  - DIRECT
  include-all: true
  filter: .*
- name: 🛑 广告过滤
  type: select
  proxies:
  - REJECT
  - 🌍 海外默认
  - DIRECT
