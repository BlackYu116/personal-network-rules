- name: 🇺🇸 美国节点
  type: select
  include-all: true
  filter: (?i)(DMIT|美国|美國|洛杉矶|洛杉磯|United States|USA|🇺🇸|(^|[^A-Za-z])US([^A-Za-z]|$))
- name: 🇯🇵 日本节点
  type: select
  include-all: true
  filter: (?i)日本|🇯🇵|Japan|\bJP\b
- name: 🇭🇰 香港节点
  type: select
  include-all: true
  filter: (?i)香港|🇭🇰|Hong Kong|\bHK\b
- name: 🇬🇧 英国节点
  type: select
  include-all: true
  filter: (?i)英国|英國|🇬🇧|United Kingdom|\bUK\b
- name: 🇸🇬 新加坡节点
  type: select
  include-all: true
  filter: (?i)新加坡|狮城|獅城|🇸🇬|Singapore|\bSG\b
- name: 🌐 全部节点
  type: select
  include-all: true
  filter: .*
- name: 🇺🇸 DMIT 专线
  type: select
  include-all: true
  filter: (?i)(^|[^A-Za-z0-9])DMIT([^A-Za-z0-9]|$)
